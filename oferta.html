<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oferta CORESAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1080px;
      height: 1920px;
      margin: 0;
      padding: 0;
    }

    .oferta-wrap {
      background: #8b0000; /* ← FONDO ROJO SÓLIDO, SIN DEGRADADO */
      border-radius: 0;
      overflow: hidden;
      font-family: 'Oswald', sans-serif;
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
    }

    /* === FRANJA SUPERIOR === */
    .header-strip {
      background: #f7c200; /* ← COLOR FRANJA SUPERIOR */
      padding: 44px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .coresan-logo {
      font-size: 72px;
      font-weight: 700;
      color: #8b0000;
      letter-spacing: 6px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header-sub {
      font-size: 30px;
      color: #8b0000;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Roboto Condensed', sans-serif;
      margin-top: 8px;
    }

    .oferta-badge {
      background: #8b0000;
      color: #f7c200; /* ← AMARILLO PURO, SIN TRANSPARENCIA */
      font-size: 80px;
      font-weight: 700;
      padding: 20px 52px;
      border-radius: 0;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* === IMAGEN === */
    .body-section {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .img-col {
      width: 100%;
      height: 820px; /* ← ALTO DE LA IMAGEN */
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .img-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Etiqueta amarilla PURA sobre la imagen — sin transparencia */
    .img-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #f7c200; /* ← AMARILLO SÓLIDO */
      text-align: center;
      padding: 30px 16px;
      font-size: 52px;
      font-weight: 700;
      color: #8b0000;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    /* === PRECIOS === */
    .info-col {
      flex: 1;
      padding: 56px 70px 60px; /* ← MÁS PADDING ABAJO para que respire */
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .producto-titulo {
      color: #f7c200; /* ← AMARILLO PURO */
      font-size: 110px; /* ← MÁS GRANDE */
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 2px;
    }

    .producto-sub {
      color: #fff;
      font-size: 40px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Roboto Condensed', sans-serif;
      opacity: 0.9;
      margin-top: -10px;
    }

    .precios-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .precio-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.10);
      border-radius: 0;
      padding: 32px 44px;
      border-left: 14px solid #f7c200; /* ← AMARILLO PURO */
    }

    .precio-row.destacado {
      background: rgba(247,194,0,0.15);
      border-left-color: #fff;
    }

    .precio-cantidad {
      font-size: 54px; /* ← MÁS GRANDE */
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .precio-valor {
      font-size: 84px; /* ← MÁS GRANDE */
      font-weight: 700;
      color: #f7c200; /* ← AMARILLO PURO */
      letter-spacing: 1px;
    }

    .precio-row.destacado .precio-cantidad { color: #f7c200; }
    .precio-row.destacado .precio-valor    { color: #fff; font-size: 96px; }

    .precio-nota {
      font-size: 30px;
      color: rgba(255,255,255,0.50);
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* === FRANJA INFERIOR === */
    .footer-strip {
      background: rgba(0,0,0,0.40);
      padding: 38px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-txt {
      color: rgba(255,255,255,0.65);
      font-size: 30px;
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer-contacto {
      color: #f7c200;
      font-size: 34px;
      font-weight: 700;
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

  </style>
</head>
<body>

<div class="oferta-wrap">

  <!-- FRANJA SUPERIOR -->
  <div class="header-strip">
    <div>
      <div class="coresan-logo">CORESAN</div>           <!-- ← NOMBRE DEL NEGOCIO -->
      <div class="header-sub">Distribuidora Mayorista · Mendoza</div> <!-- ← SUBTÍTULO -->
    </div>
    <div class="oferta-badge">¡OFERTA!</div>            <!-- ← TEXTO DEL BADGE -->
  </div>

  <div class="body-section">

    <!-- IMAGEN DEL PRODUCTO
         Poné el archivo en la carpeta "imagenes/" y cambiá el nombre acá -->
    <div class="img-col">
      <img src="imagenes/grasa-jocoli800g.jpg" alt="Producto" /> <!-- ← RUTA DE LA IMAGEN -->

      <!-- ETIQUETA SOBRE LA IMAGEN — borrá este bloque si no la necesitás -->
      <div class="img-label">
         ¡Para las tortafritas!                       <!-- ← TEXTO SOBRE LA IMAGEN -->
      </div>
    </div>

    <div class="info-col">

      <div class="producto-titulo">Grasa Jocolí</div>   <!-- ← NOMBRE DEL PRODUCTO -->
      <div class="producto-sub">Grasa vacuna comestible · 100% bovina</div> <!-- ← DESCRIPCIÓN -->

      <!-- PRECIOS — copiá o borrá filas según necesites -->
      <div class="precios-grid">

        <div class="precio-row">
          <span class="precio-cantidad">× 800 g</span>  <!-- ← CANTIDAD -->
          <span class="precio-valor">$2.850</span>       <!-- ← PRECIO -->
        </div>

        <div class="precio-row">
          <span class="precio-cantidad">× 1 kg</span>
          <span class="precio-valor">$3.630</span>
        </div>

        <!-- FILA DESTACADA (mayorista/caja) — solo una con "destacado" -->
        <div class="precio-row destacado">
          <span class="precio-cantidad">× 12 kg (caja)</span>
          <span class="precio-valor">$34.319</span>
        </div>

      </div>

      <div class="precio-nota">* Precios mayoristas · Consultar disponibilidad</div> <!-- ← ACLARACIÓN -->

    </div>
  </div>

  <!-- FRANJA INFERIOR -->
  <div class="footer-strip">
    <div class="footer-txt">Distribuidora CORESAN · Mendoza</div> <!-- ← PIE IZQUIERDO -->
    <div class="footer-contacto">Consultar por WhatsApp</div>      <!-- ← PIE DERECHO -->
  </div>

</div>

</body>
</html>
