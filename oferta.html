<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oferta CORESAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Resolución estado de WhatsApp: 1080×1920px */
      width: 1080px;
      height: 1920px;
      margin: 0;
      padding: 0;
    }

    .oferta-wrap {
      background: linear-gradient(160deg, #c8151a 0%, #8b0000 100%);
      border-radius: 0;
      overflow: hidden;
      font-family: 'Oswald', sans-serif;
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
    }

    /* =============================================
       FRANJA SUPERIOR (amarilla)
       — COLOR: cambiá #f7c200 por otro si querés
    ============================================= */
    .header-strip {
      background: #f7c200; /* ← COLOR FRANJA SUPERIOR */
      padding: 40px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .coresan-logo {
      font-size: 64px;
      font-weight: 700;
      color: #8b0000;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .header-sub {
      font-size: 32px;
      color: #8b0000;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Roboto Condensed', sans-serif;
    }

    .oferta-badge {
      background: #8b0000;
      color: #f7c200;
      font-size: 72px;
      font-weight: 700;
      padding: 16px 48px;
      border-radius: 0;
      letter-spacing: 4px;
    }

    .body-section {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* --- IMAGEN DEL PRODUCTO ---
       ← Cambiá height para dar más o menos espacio a la foto */
    .img-col {
      width: 100%;
      height: 900px; /* ← ALTO DE LA IMAGEN */
      position: relative;
      overflow: hidden;
      background: rgba(0,0,0,0.15);
    }

    .img-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Etiqueta amarilla sobre la imagen */
    .img-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(247,194,0,0.92);
      text-align: center;
      padding: 28px 16px;
      font-size: 48px;
      font-weight: 700;
      color: #8b0000;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* --- TEXTO Y PRECIOS --- */
    .info-col {
      flex: 1;
      padding: 60px 70px 50px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .producto-titulo {
      color: #f7c200; /* ← COLOR DEL TÍTULO */
      font-size: 96px; /* ← TAMAÑO DEL TÍTULO */
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: 3px;
    }

    .producto-sub {
      color: #fff;
      font-size: 40px;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Roboto Condensed', sans-serif;
      margin-top: -20px;
    }

    /* --- FILAS DE PRECIOS --- */
    .precios-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .precio-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.08);
      border-radius: 0;
      padding: 28px 40px;
      border-left: 12px solid #f7c200;
    }

    /* Fila destacada — la más importante */
    .precio-row.destacado {
      background: rgba(247,194,0,0.18);
      border-left-color: #fff;
    }

    .precio-cantidad {
      font-size: 48px;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
    }

    .precio-valor {
      font-size: 72px;
      font-weight: 700;
      color: #f7c200;
    }

    .precio-row.destacado .precio-cantidad { color: #f7c200; }
    .precio-row.destacado .precio-valor    { color: #fff; }

    .precio-nota {
      font-size: 32px;
      color: rgba(255,255,255,0.55);
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- FRANJA INFERIOR --- */
    .footer-strip {
      background: rgba(0,0,0,0.3);
      padding: 36px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-txt {
      color: rgba(255,255,255,0.7);
      font-size: 32px;
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer-contacto {
      color: #f7c200;
      font-size: 36px;
      font-weight: 600;
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

  </style>
</head>
<body>

<div class="oferta-wrap">

  <!-- FRANJA SUPERIOR -->
  <div class="header-strip">
    <div>
      <div class="coresan-logo">CORESAN</div> <!-- ← NOMBRE DEL NEGOCIO -->
      <div class="header-sub">Distribuidora Mayorista · Mendoza</div> <!-- ← SUBTÍTULO -->
    </div>
    <div class="oferta-badge">¡OFERTA!</div> <!-- ← TEXTO DEL BADGE -->
  </div>

  <div class="body-section">

    <!-- IMAGEN DEL PRODUCTO
         Poné el archivo en la carpeta "imagenes/" y cambiá el nombre acá -->
    <div class="img-col">
      <img src="imagenes/grasa-jocoli800g.jpg" alt="Producto" /> <!-- ← RUTA DE LA IMAGEN -->

      <!-- ETIQUETA SOBRE LA IMAGEN — borrá este bloque si no la necesitás -->
      <div class="img-label">
        🫓 ¡Para las tortafritas! <!-- ← TEXTO SOBRE LA IMAGEN -->
      </div>
    </div>

    <div class="info-col">

      <div class="producto-titulo">Grasa Jocolí</div> <!-- ← NOMBRE DEL PRODUCTO -->
      <div class="producto-sub">Grasa vacuna comestible · 100% bovina</div> <!-- ← DESCRIPCIÓN -->

      <!-- PRECIOS — copiá o borrá filas según necesites -->
      <div class="precios-grid">

        <div class="precio-row">
          <span class="precio-cantidad">× 800 g</span> <!-- ← CANTIDAD -->
          <span class="precio-valor">$2.850</span>      <!-- ← PRECIO -->
        </div>

        <div class="precio-row">
          <span class="precio-cantidad">× 1 kg</span>
          <span class="precio-valor">$3.630</span>
        </div>

        <!-- FILA DESTACADA (mayorista/caja) — solo una con "destacado" -->
        <div class="precio-row destacado">
          <span class="precio-cantidad">× 12 kg (caja)</span>
          <span class="precio-valor">$34.319</span>
        </div>

      </div>

      <div class="precio-nota">* Precios mayoristas · Consultar disponibilidad</div> <!-- ← ACLARACIÓN -->

    </div>
  </div>

  <!-- FRANJA INFERIOR -->
  <div class="footer-strip">
    <div class="footer-txt">Distribuidora CORESAN · Mendoza</div> <!-- ← PIE IZQUIERDO -->
    <div class="footer-contacto">Consultar por WhatsApp</div>      <!-- ← PIE DERECHO -->
  </div>

</div>

</body>
</html>
